<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nos photos — Honoré &amp; Hadja Mariama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--accent:#1F4D3A;--ivory:#FBF7EF;--sand:#F2EBDC;--line:#E8E0CF;--ink:#1C2B24;--muted:#4A5751;--gold:#C9A24D;--cream:#E9D9AE}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ivory);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
  header{background:var(--accent);color:var(--ivory);text-align:center;padding:44px 20px 0}
  header .eyebrow{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--cream)}
  header h1{margin:10px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,8vw,52px);line-height:1.05}
  header h1 em{color:var(--cream)}
  header p{margin:12px auto 0;max-width:420px;color:#E4EDE8;font-size:15px}
  .strata{display:block;width:100%;height:60px;margin-top:28px}
  main{max-width:1100px;margin:0 auto;padding:24px 16px 40px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
  .count{margin:0;color:var(--muted);font-size:14px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;background:var(--accent);color:var(--ivory);font:inherit;font-weight:600;font-size:14px;text-decoration:none;border:none;cursor:pointer}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .grid button{padding:0;border:none;background:var(--sand);border-radius:10px;overflow:hidden;aspect-ratio:1;cursor:pointer;display:block;width:100%}
  .grid img{width:100%;height:100%;object-fit:cover;display:block}
  .empty{text-align:center;padding:48px 20px;border:2px dashed var(--gold);border-radius:20px;background:var(--sand);color:var(--muted)}
  .empty h2{margin:0 0 8px;font-family:'Cormorant Garamond',Georgia,serif;font-size:28px;color:var(--accent)}
  .lb{position:fixed;inset:0;background:rgba(14,22,18,.94);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:16px}
  .lb.open{display:flex}
  .lb img{max-width:100%;max-height:calc(100vh - 150px);border-radius:8px;object-fit:contain}
  .lb .cap{color:#E4EDE8;font-size:14px;margin:10px 0 0;min-height:21px}
  .lb .ctrl{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;justify-content:center}
  .lb .ctrl button,.lb .ctrl a{min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;border:1px solid rgba(233,217,174,.5);background:transparent;color:var(--ivory);font:inherit;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
  footer{text-align:center;padding:10px 20px 40px;font-size:13px}
  footer a{color:var(--accent);font-weight:600;margin:0 8px}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header>
  <p class="eyebrow">Nos photos</p>
  <h1>Honoré <em>&amp;</em> Hadja Mariama</h1>
  <p>Tous les souvenirs partagés par les invités, au fil de la fête.</p>
  <svg class="strata" aria-hidden="true" viewBox="0 0 390 60" preserveAspectRatio="none">
    <path d="M0 14 C 80 4, 150 24, 230 12 S 350 6, 390 16 L390 60 L0 60 Z" fill="#2A5E48"/>
    <path d="M0 28 C 90 20, 160 38, 250 26 S 350 22, 390 30 L390 60 L0 60 Z" fill="#C9A24D" opacity=".55"/>
    <path d="M0 40 C 70 34, 170 50, 260 40 S 350 36, 390 42 L390 60 L0 60 Z" fill="#E9D9AE"/>
    <path d="M0 50 C 100 46, 180 56, 270 50 S 360 48, 390 52 L390 60 L0 60 Z" fill="#FBF7EF"/>
  </svg>
</header>

<main>
  <div class="bar">
    <p class="count" id="count" role="status" aria-live="polite">Chargement des photos…</p>
    <a class="btn" href="../envoyer/">Partager mes photos</a>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <h2>Les photos arrivent bientôt</h2>
    <p>Elles apparaîtront ici dès que les invités commenceront à les partager.</p>
  </div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo en grand">
  <img id="lb-img" alt="">
  <p class="cap" id="lb-cap"></p>
  <div class="ctrl">
    <button type="button" id="prev" aria-label="Photo précédente">‹</button>
    <a id="dl" href="#" target="_blank" rel="noopener">Télécharger</a>
    <button type="button" id="close">Fermer</button>
    <button type="button" id="next" aria-label="Photo suivante">›</button>
  </div>
</div>

<footer>
  <a href="../">Retour au site du mariage</a>
</footer>

<script>
(function(){
  const CLOUD = "dttnmd38e", TAG = "mariage";
  const base = `https://res.cloudinary.com/${CLOUD}/image/upload/`;
  const url = (r, t) => `${base}${t}/v${r.version}/${r.public_id}.${r.format}`;
  const $ = (id) => document.getElementById(id);
  let photos = [], idx = 0, lastKey = '';

  async function load(){
    try {
      let LIST = [];
      try {
        const res = await fetch(`https://res.cloudinary.com/${CLOUD}/image/list/${TAG}.json?t=${Date.now()}`);
        if (res.ok) LIST = (await res.json()).resources || [];
      } catch (e) {}
      const recent = (() => { try { const now = Date.now(); return JSON.parse(localStorage.getItem('mariage_recent') || '[]').filter(x => now - x.t < 3 * 3600e3); } catch (e) { return []; } })();
      const known = new Set(LIST.map(p => p.public_id));
      recent.forEach(x => { if (!known.has(x.public_id)) LIST.push(x); });
      photos = LIST.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
    } catch (e) {
      photos = [];
    }
    render();
  }

  function render(){
    const key = photos.map(p => p.public_id).join('|');
    if (key === lastKey && photos.length) return;
    lastKey = key;
    $('count').textContent = photos.length ? `${photos.length} photo${photos.length > 1 ? 's' : ''} partagée${photos.length > 1 ? 's' : ''}` : '';
    $('empty').hidden = photos.length > 0;
    const grid = $('grid');
    grid.textContent = '';
    photos.forEach((p, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      const who = invite(p);
      b.setAttribute('aria-label', who ? `Photo de ${who}` : `Photo ${i + 1}`);
      const img = document.createElement('img');
      img.loading = 'lazy'; img.alt = '';
      img.src = url(p, 'c_fill,w_400,h_400,g_auto,q_auto,f_auto');
      b.appendChild(img);
      b.addEventListener('click', () => open(i));
      grid.appendChild(b);
    });
  }

  function invite(p){
    const c = p.context && (p.context.custom || p.context);
    return (c && c.invite) || '';
  }

  function open(i){
    idx = (i + photos.length) % photos.length;
    const p = photos[idx];
    $('lb-img').src = url(p, 'c_limit,w_1600,h_1600,q_auto,f_auto');
    const who = invite(p);
    $('lb-cap').textContent = (who ? `Partagée par ${who} · ` : '') + `${idx + 1} / ${photos.length}`;
    $('dl').href = url(p, 'fl_attachment');
    $('lb').classList.add('open');
    $('close').focus();
  }
  function close(){ $('lb').classList.remove('open'); }

  $('prev').addEventListener('click', () => open(idx - 1));
  $('next').addEventListener('click', () => open(idx + 1));
  $('close').addEventListener('click', close);
  $('lb').addEventListener('click', (e) => { if (e.target.id === 'lb') close(); });
  document.addEventListener('keydown', (e) => {
    if (!$('lb').classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') open(idx - 1);
    if (e.key === 'ArrowRight') open(idx + 1);
  });
  let sx = null;
  $('lb').addEventListener('touchstart', (e) => { sx = e.touches[0].clientX; }, { passive: true });
  $('lb').addEventListener('touchend', (e) => {
    if (sx === null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (Math.abs(dx) > 50) open(idx + (dx < 0 ? 1 : -1));
  });

  load();
  setInterval(load, 60000);
})();
</script>
</body>
</html>
