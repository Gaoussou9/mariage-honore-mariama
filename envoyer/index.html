<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Partagez vos photos — Honoré &amp; Hadja Mariama</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--accent:#1F4D3A;--ivory:#FBF7EF;--sand:#F2EBDC;--line:#E8E0CF;--ink:#1C2B24;--muted:#4A5751;--gold-text:#8A6420;--gold:#C9A24D;--cream:#E9D9AE}
  *{box-sizing:border-box}
  body{margin:0;background:var(--ivory);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:0 20px}
  header{background:var(--accent);color:var(--ivory);text-align:center;padding:44px 0 0}
  header .eyebrow{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--cream)}
  header h1{margin:10px 0 0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(34px,9vw,48px);line-height:1.05}
  header h1 em{color:var(--cream)}
  header p{margin:12px auto 0;max-width:380px;color:#E4EDE8;font-size:15px}
  .strata{display:block;width:100%;height:60px;margin-top:28px}
  main{padding:28px 0 40px}
  .card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:16px}
  label{display:block;font-size:14px;font-weight:500;margin-bottom:6px}
  input[type=text]{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1px solid #CFC4AC;font:inherit;font-size:16px;background:var(--ivory);color:var(--ink)}
  .pick{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:150px;border:2px dashed var(--gold);border-radius:16px;background:var(--sand);text-align:center;padding:20px;cursor:pointer}
  .pick:focus-within{outline:2px solid var(--accent);outline-offset:3px}
  .pick input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
  .pick strong{font-size:17px}
  .pick span{font-size:13px;color:var(--muted)}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border:none;border-radius:999px;background:var(--accent);color:var(--ivory);font:inherit;font-weight:600;font-size:16px;cursor:pointer}
  .btn:disabled{background:#9DB0A6;cursor:not-allowed}
  .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .item{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--sand)}
  .item img{width:100%;height:100%;object-fit:cover;display:block}
  .item .bar{position:absolute;left:0;bottom:0;height:5px;background:var(--gold);width:0;transition:width .2s}
  .item .badge{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
  .item.done .badge{background:var(--accent)}
  .item.err .badge{background:#A33A2B}
  .item.done .bar{width:100%!important;background:var(--accent)}
  .status{margin:0;font-size:14px;color:var(--muted);text-align:center;min-height:21px}
  .ok{display:none;text-align:center;padding:26px 20px;border-radius:20px;background:#E3EEE7;border:1px solid #B7D0C0}
  .ok h2{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;font-weight:600;color:var(--accent)}
  .ok p{margin:8px 0 16px;color:var(--muted)}
  .ok .btn{background:var(--ink)}
  footer{text-align:center;padding:10px 0 40px;font-size:13px;color:#5B6660}
  footer a{color:var(--accent);font-weight:600}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>

<script>
/* ============================================================
   CONFIGURATION — à remplir avec les infos de ton compte Cloudinary
   ============================================================ */
const CONFIG = {
  cloudName: "dttnmd38e",
  uploadPreset: "mariage_hh",   // preset en mode Unsigned à créer dans Cloudinary
  folder: "mariage-honore-hadja-mariama",
  siteMariage: "https://gaoussou9.github.io/mariage-honore-mariama/",
  tailleMax: 2560,          // côté le plus long, en pixels, après réduction
  qualite: 0.85             // qualité JPEG (0 à 1)
};
</script>

<header>
  <div class="wrap">
    <p class="eyebrow">Galerie des invités</p>
    <h1>Honoré <em>&amp;</em> Hadja Mariama</h1>
    <p>Souvenirs avec les mariés, préparatifs, jour J : partagez vos photos à tout moment. Les mariés les garderont toutes.</p>
  </div>
  <svg class="strata" aria-hidden="true" viewBox="0 0 390 60" preserveAspectRatio="none">
    <path d="M0 14 C 80 4, 150 24, 230 12 S 350 6, 390 16 L390 60 L0 60 Z" fill="#2A5E48"/>
    <path d="M0 28 C 90 20, 160 38, 250 26 S 350 22, 390 30 L390 60 L0 60 Z" fill="#C9A24D" opacity=".55"/>
    <path d="M0 40 C 70 34, 170 50, 260 40 S 350 36, 390 42 L390 60 L0 60 Z" fill="#E9D9AE"/>
    <path d="M0 50 C 100 46, 180 56, 270 50 S 360 48, 390 52 L390 60 L0 60 Z" fill="#FBF7EF"/>
  </svg>
</header>

<main>
  <div class="wrap">
    <form class="card" id="form" novalidate>
      <div>
        <label for="nom">Votre prénom <span style="font-weight:400;color:#5B6660">(facultatif)</span></label>
        <input id="nom" type="text" autocomplete="given-name" placeholder="Ex. Aïssatou">
      </div>
      <div class="pick">
        <input id="files" type="file" accept="image/*" multiple aria-label="Choisir des photos">
        <svg aria-hidden="true" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1F4D3A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2l2-2h6l2 2h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>
        <strong>Choisir des photos</strong>
        <span>Depuis votre galerie ou l'appareil photo</span>
      </div>
      <div class="grid" id="grid"></div>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <button class="btn" id="send" type="submit" disabled>Envoyer aux mariés</button>
    </form>

    <div class="ok" id="ok" role="status">
      <h2>Merci !</h2>
      <p id="ok-txt"></p>
      <div class="grid" id="sent" style="margin:0 0 16px"></div>
      <button class="btn" id="again" type="button">Envoyer d'autres photos</button>
      <a href="../galerie/" style="display:inline-block;margin-top:14px;color:#1F4D3A;font-weight:600">Voir toutes les photos</a>
    </div>
  </div>
</main>

<footer id="footer"></footer>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const C = CONFIG;
  let items = [];   // { file, el, state }
  let busy = false;

  if (C.siteMariage) {
    $('footer').innerHTML = `<a href="${C.siteMariage}">Retour au site du mariage</a>`;
  }
  if (!C.cloudName || !C.uploadPreset) {
    $('status').textContent = "Configuration Cloudinary manquante : remplis cloudName et uploadPreset.";
  }

  $('files').addEventListener('change', (e) => {
    const files = [...e.target.files].filter(f => f.type.startsWith('image/') || /\.(heic|heif)$/i.test(f.name));
    files.forEach(addItem);
    e.target.value = '';
    refresh();
  });

  function addItem(file){
    const el = document.createElement('div');
    el.className = 'item';
    const img = document.createElement('img');
    img.alt = '';
    img.src = URL.createObjectURL(file);
    const bar = document.createElement('div'); bar.className = 'bar';
    const badge = document.createElement('div'); badge.className = 'badge';
    el.append(img, bar, badge);
    $('grid').appendChild(el);
    items.push({ file, el, bar, badge, state: 'todo' });
  }

  // Garde les photos envoyées depuis ce téléphone, pour les montrer tout de suite sur le site
  function remember(rec){
    try {
      const k = 'mariage_recent';
      const now = Date.now();
      const list = JSON.parse(localStorage.getItem(k) || '[]').filter(x => now - x.t < 3 * 3600e3);
      list.push(Object.assign({ t: now }, rec));
      localStorage.setItem(k, JSON.stringify(list.slice(-50)));
    } catch (e) {}
  }

  function refresh(){
    const todo = items.filter(i => i.state !== 'done').length;
    $('send').disabled = busy || todo === 0 || !C.cloudName || !C.uploadPreset;
    $('send').textContent = todo > 1 ? `Envoyer ${todo} photos aux mariés` : 'Envoyer aux mariés';
    if (!busy && C.cloudName) $('status').textContent = todo ? `${todo} photo${todo > 1 ? 's' : ''} prête${todo > 1 ? 's' : ''} à envoyer` : '';
  }

  // Réduit la photo dans le téléphone avant l'envoi
  async function shrink(file){
    try {
      const url = URL.createObjectURL(file);
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const max = C.tailleMax;
      const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      if (scale === 1 && file.size < 2.5e6 && file.type === 'image/jpeg') return file;
      const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      const blob = await new Promise(res => cv.toBlob(res, 'image/jpeg', C.qualite));
      return blob || file;
    } catch (e) {
      return file; // en cas d'échec, on envoie l'original
    }
  }

  function upload(it, blob, nom){
    return new Promise((resolve, reject) => {
      const fd = new FormData();
      fd.append('file', blob, (it.file.name || 'photo').replace(/\.\w+$/, '') + '.jpg');
      fd.append('upload_preset', C.uploadPreset);
      if (C.folder) fd.append('folder', C.folder);
      fd.append('tags', 'mariage');
      if (nom) fd.append('context', 'invite=' + nom.replace(/[|=]/g, ' '));
      const xhr = new XMLHttpRequest();
      xhr.open('POST', `https://api.cloudinary.com/v1_1/${encodeURIComponent(C.cloudName)}/image/upload`);
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) it.bar.style.width = (e.loaded / e.total * 100) + '%'; };
      xhr.onload = () => { if (xhr.status >= 200 && xhr.status < 300) { let r = {}; try { r = JSON.parse(xhr.responseText); } catch (e) {} resolve(r); } else reject(new Error(xhr.status)); };
      xhr.onerror = () => reject(new Error('réseau'));
      xhr.send(fd);
    });
  }

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (busy) return;
    busy = true; refresh();
    const nom = $('nom').value.trim();
    const todo = items.filter(i => i.state !== 'done');
    let ok = 0, ko = 0;
    for (let n = 0; n < todo.length; n++) {
      const it = todo[n];
      $('status').textContent = `Envoi de la photo ${n + 1} sur ${todo.length}…`;
      it.el.classList.remove('err'); it.badge.textContent = '';
      try {
        const blob = await shrink(it.file);
        const r = await upload(it, blob, nom);
        if (r && r.public_id) remember({ public_id: r.public_id, version: r.version, format: r.format || 'jpg', created_at: r.created_at || new Date().toISOString(), context: { custom: { invite: nom } } });
        it.state = 'done'; it.el.classList.add('done'); it.badge.textContent = '✓'; ok++;
      } catch (err) {
        it.state = 'err'; it.el.classList.add('err'); it.badge.textContent = '!'; ko++;
      }
    }
    busy = false;
    const total = items.filter(i => i.state === 'done').length;
    if (ko === 0) {
      $('form').style.display = 'none';
      $('ok').style.display = 'block';
      $('ok-txt').textContent = `${total} photo${total > 1 ? 's' : ''} envoyée${total > 1 ? 's' : ''} aux mariés. Elle${total > 1 ? 's' : ''} apparaîtr${total > 1 ? 'ont' : 'a'} dans la galerie pour tous d'ici une minute ou deux.`;
      const sent = $('sent'); sent.textContent = '';
      items.filter(i => i.state === 'done').forEach(i => { const d = document.createElement('div'); d.className = 'item'; const im = document.createElement('img'); im.alt = ''; im.src = i.el.querySelector('img').src; d.appendChild(im); sent.appendChild(d); });
    } else {
      $('status').textContent = `${ok} envoyée${ok > 1 ? 's' : ''}, ${ko} en échec. Vérifiez votre connexion puis appuyez à nouveau sur Envoyer.`;
      refresh();
      $('status').textContent = `${ok} envoyée${ok > 1 ? 's' : ''}, ${ko} en échec. Vérifiez votre connexion puis réessayez.`;
    }
  });

  $('again').addEventListener('click', () => {
    items.forEach(i => URL.revokeObjectURL(i.el.querySelector('img').src));
    items = []; $('grid').innerHTML = '';
    $('ok').style.display = 'none'; $('form').style.display = '';
    refresh();
  });

  refresh();
})();
</script>
</body>
</html>
